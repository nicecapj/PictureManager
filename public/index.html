<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Manager · 사진 Diff & 동기화</title>
  <meta name="description" content="두 폴더의 사진·동영상을 비교해 중복·유사 항목을 찾아 한 폴더로 동기화하는 사진 관리 도구">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo"><span class="logo-mark">◐</span> Picture<b>Diff</b></h1>
    <div class="folders">
      <div class="folder-field a"><label>A</label><input id="dirA" placeholder="원본 폴더 A"><button class="btn ghost" data-browse="dirA">📁</button></div>
      <div class="folder-field b"><label>B</label><input id="dirB" placeholder="원본 폴더 B"><button class="btn ghost" data-browse="dirB">📁</button></div>
      <div class="folder-field c"><label>C</label><input id="dirC" placeholder="동기화 대상 폴더 C"><button class="btn ghost" data-browse="dirC">📁</button></div>
    </div>
    <div class="scan-ctrl">
      <label class="thr" title="유사도 임계값 (dHash 해밍거리, 낮을수록 엄격)">유사도 <input id="threshold" type="range" min="0" max="16" value="6"><span id="thrVal">6</span></label>
      <button id="btnScan" class="btn primary">🔍 스캔</button>
    </div>
  </header>

  <div id="progress" class="progress hidden"><div class="bar"><i id="progBar"></i></div><span id="progText"></span></div>

  <main class="layout">
    <aside class="sidebar">
      <nav class="tabs" id="tabs">
        <button class="tab active" data-filter="all">전체 <em id="cnt-all">0</em></button>
        <button class="tab" data-filter="exact">🟰 완전 동일 <em id="cnt-exact">0</em></button>
        <button class="tab" data-filter="similar">≈ 유사 <em id="cnt-similar">0</em></button>
        <button class="tab" data-filter="conflict">⚠ 이름 충돌 <em id="cnt-conflict">0</em></button>
        <button class="tab" data-filter="onlyA">A에만 <em id="cnt-onlyA">0</em></button>
        <button class="tab" data-filter="onlyB">B에만 <em id="cnt-onlyB">0</em></button>
        <button class="tab" data-filter="unique">고유 전체 <em id="cnt-unique">0</em></button>
        <button class="tab" data-filter="photo">🖼 사진 <em id="cnt-photo">0</em></button>
        <button class="tab" data-filter="video">🎬 동영상 <em id="cnt-video">0</em></button>
      </nav>
      <div class="side-box">
        <input id="search" class="search" placeholder="파일명 검색…">
        <button id="btnRecommend" class="btn ghost w">✨ 추천대로 선택</button>
        <button id="btnKeepAll" class="btn ghost w">☑ 보이는 항목 모두 유지</button>
      </div>
      <div class="side-box sync">
        <h2>동기화 → C</h2>
        <div class="seg" id="mode">
          <label><input type="radio" name="mode" value="copy" checked> 복사</label>
          <label><input type="radio" name="mode" value="move"> 이동</label>
        </div>
        <label class="lbl">체크 안 된 파일</label>
        <select id="unchecked">
          <option value="leave">그대로 두기</option>
          <option value="trash">C/_휴지통 으로 이동</option>
          <option value="delete">영구 삭제 ⚠</option>
        </select>
        <div id="uncheckedHint" class="lbl hidden" style="color:var(--warn)">이동 모드: 중복·미체크 파일은 C/삭제예정 으로 이동 (같은 내용은 1개만 남김)</div>
        <div class="stat" id="selStat">유지 0 / 전체 0</div>
        <button id="btnSync" class="btn primary w" disabled>🚀 동기화 실행</button>
      </div>
    </aside>

    <section class="content">
      <div id="empty" class="empty">
        <div class="empty-ico">🖼️</div>
        <h2>두 폴더를 지정하고 스캔하세요</h2>
        <p>하위 폴더까지 검색하여 <b>픽셀 내용</b>이 같은 사진(이름·날짜·EXIF가 달라도)과<br>유사한 사진을 찾아 그룹으로 보여줍니다.<br>동영상은 <b>영상·음성 스트림</b>이 같은지, 주요 장면이 비슷한지로 비교합니다.</p>
      </div>
      <div id="groups" class="groups"></div>
      <div id="more" class="more hidden"><button class="btn ghost" id="btnMore">더 보기</button></div>
    </section>
  </main>

  <!-- 폴더 선택 모달 -->
  <div id="browser" class="modal hidden">
    <div class="modal-card">
      <h3>폴더 선택</h3>
      <div class="crumb"><button class="btn ghost sm" id="brUp">⬆</button><input id="brPath"><button class="btn ghost sm" id="brGo">이동</button></div>
      <ul id="brList" class="br-list"></ul>
      <div class="modal-foot">
        <button class="btn ghost" id="brMk">+ 새 폴더</button>
        <span class="sp"></span>
        <button class="btn ghost" id="brCancel">취소</button>
        <button class="btn primary" id="brOk">이 폴더 선택</button>
      </div>
    </div>
  </div>

  <!-- Diff 모달 -->
  <div id="diff" class="modal hidden">
    <div class="diff-card">
      <div class="diff-head">
        <div class="seg" id="diffMode">
          <label><input type="radio" name="dm" value="side" checked> 나란히</label>
          <label><input type="radio" name="dm" value="slider"> 슬라이더</label>
          <label><input type="radio" name="dm" value="diff"> 차이 강조</label>
        </div>
        <span class="sp"></span>
        <button class="btn ghost" id="diffClose">✕</button>
      </div>
      <div class="diff-body" id="diffBody"></div>
      <table class="meta-table" id="diffMeta"></table>
    </div>
  </div>

  <!-- 뷰어 -->
  <div id="viewer" class="viewer hidden">
    <button class="v-nav prev" id="vPrev">‹</button>
    <div class="v-stage" id="vStage"><img id="vImg" alt=""><video id="vVid" class="hidden" controls autoplay></video></div>
    <button class="v-nav next" id="vNext">›</button>
    <div class="v-bar">
      <span id="vInfo"></span>
      <span class="sp"></span>
      <button class="btn ghost sm" id="vKeep">☐ 유지</button>
      <button class="btn ghost sm" id="vOpen">탐색기</button>
      <button class="btn ghost sm" id="vClose">✕</button>
    </div>
  </div>

  <!-- 진행 오버레이 -->
  <div id="jobOverlay" class="modal hidden">
    <div class="job-card">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/></svg>
        <div class="ring-pct" id="jobPct">0%</div>
      </div>
      <h3 id="jobTitle">동기화 중…</h3>
      <div class="job-bar"><i id="jobBar"></i></div>
      <div class="job-row"><span id="jobCount">0 / 0</span><span id="jobEta"></span></div>
      <div class="job-cur" id="jobCur"></div>
      <div class="job-stats" id="jobStats"></div>
      <div style="margin-top:14px"><button class="btn ghost sm" id="btnCancelJob">✕ 작업 중단</button></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
